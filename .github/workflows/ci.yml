name: Local checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned dependencies
        run: |
          python -m pip install -r .\requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency consistency check failed.' }
      - name: Ensure local Bicep compiler
        run: |
          az bicep version --only-show-errors
          if ($LASTEXITCODE -ne 0) {
            az bicep install --only-show-errors
            if ($LASTEXITCODE -ne 0) { throw 'Bicep installation failed.' }
          }
      - name: Check source and assemble ZIP
        run: .\tools\check_local.ps1 -Python python
      - name: Check the extracted distribution
        run: |
          Expand-Archive -LiteralPath '.\dist\getpractical-sandboxes-lab.zip' `
              -DestinationPath '.\.local\package-check'
          & '.\.local\package-check\getpractical-sandboxes-lab\tools\check_local.ps1' -Python python
